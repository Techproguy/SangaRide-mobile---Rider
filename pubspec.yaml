name: sanga_ride
description: "The official repository for the Sanga Ride rider app. Frontend only."

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  sanga_ride_ui:
    path: ../sanga_ride_ui
  get: ^4.7.3
  go_router: ^17.0.1
  dio: ^5.9.1
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^10.0.0
  get_storage: ^2.1.1
  connectivity_plus: ^6.1.0
  intl: ^0.20.3
  google_maps_flutter: ^2.14.0
  geolocator: ^13.0.2
  flutter_polyline_points: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/regular.ttf
          weight: 400

        - asset: assets/fonts/italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/medium.ttf
          weight: 500

        - asset: assets/fonts/medium_italic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/semibold.ttf
          weight: 600

        - asset: assets/fonts/semibold_italic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/bold.ttf
          weight: 700

        - asset: assets/fonts/bold_italic.ttf
          weight: 700
          style: italic
