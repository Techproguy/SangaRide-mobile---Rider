definitions:
  environment: &environment
    flutter: 3.47.6
    xcode: latest
    cocoapods: default
  triggering: &on_version_tag
    events:
      - tag
    tag_patterns:
      - pattern: "v*"
        include: true
  scripts:
    - &fetch_building_blocks
      name: Fetch sanga-ride-building-blocks
      script: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git clone --depth 1 git@github.com:Techproguy/sanga-ride-building-blocks.git "$CM_BUILD_DIR/../sanga-ride-building-blocks"
    - &write_env_config
      name: Write env config
      script: |
        python3 - <<'PY'
        import json, os
        env = os.environ["APP_ENV"]
        raw = os.environ[f"DART_DEFINES_{env.upper()}"]
        defines = json.loads(raw)
        with open(f"dart_defines/{env}.json", "w") as f:
            f.write(raw)
        with open("android/secrets.properties", "w") as f:
            f.write(f"MAPS_API_KEY_ANDROID={defines['MAPS_API_KEY_ANDROID']}\n")
        xcconfig = "Secrets.xcconfig" if env == "prod" else f"Secrets-{env}.xcconfig"
        with open(f"ios/Flutter/{xcconfig}", "w") as f:
            f.write(f"MAPS_API_KEY={defines['MAPS_API_KEY_IOS']}\n")
        PY
    - &ios_signing
      name: iOS signing
      script: |
        keychain initialize
        app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
        keychain add-certificates
        xcode-project use-profiles

workflows:
  testflight:
    name: Sanga Ride · TestFlight
    max_build_duration: 90
    triggering: *on_version_tag
    environment:
      <<: *environment
      groups:
        - sanga_ride_rider
      vars:
        APP_ENV: prod
        BUNDLE_ID: com.sangatechnologies.ride
        APP_STORE_APPLE_ID: 6824516357
    scripts:
      - *fetch_building_blocks
      - *write_env_config
      - *ios_signing
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          flutter build ipa --release --flavor prod \
            --dart-define-from-file=dart_defines/prod.json \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Sanga Ride External

  play-open-testing:
    name: Sanga Ride · Play open testing
    max_build_duration: 60
    triggering: *on_version_tag
    environment:
      <<: *environment
      groups:
        - sanga_ride_rider
      vars:
        APP_ENV: prod
        PACKAGE_NAME: com.sangatechnologies.ride
        CM_KEYSTORE_PATH: /tmp/upload.keystore
    scripts:
      - *fetch_building_blocks
      - *write_env_config
      - name: Android upload keystore
        script: echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
      - name: Build App Bundle
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          flutter build appbundle --release --flavor prod \
            --dart-define-from-file=dart_defines/prod.json \
            --build-number=$((LATEST + 1))
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/mapping/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta
        submit_as_draft: true
