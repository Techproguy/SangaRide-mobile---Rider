definitions:
  environment: &environment
    flutter: 3.47.6
    xcode: latest
    cocoapods: default
  triggering: &on_version_tag
    events:
      - tag
    tag_patterns:
      - pattern: "v*"
        include: true
  scripts:
    - &fetch_building_blocks
      name: Fetch sanga-ride-building-blocks
      script: |
        mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git clone --depth 1 git@github.com:Techproguy/sanga-ride-building-blocks.git "$CM_BUILD_DIR/../sanga-ride-building-blocks"
    - &write_env_config
      name: Write env config
      script: |
        python3 - <<'PY'
        import json, os
        env = os.environ["APP_ENV"]
        raw = os.environ[f"DART_DEFINES_{env.upper()}"]
        defines = json.loads(raw)
        if not defines.get("BASE_URL") or "replace-with" in defines["BASE_URL"]:
            defines["BASE_URL"] = "https://api-staging.sangaride.com"
        with open(f"dart_defines/{env}.json", "w") as f:
            json.dump(defines, f)
        with open("android/secrets.properties", "w") as f:
            f.write(f"MAPS_API_KEY_ANDROID={defines['MAPS_API_KEY_ANDROID']}\n")
        xcconfig = "Secrets.xcconfig" if env == "prod" else f"Secrets-{env}.xcconfig"
        with open(f"ios/Flutter/{xcconfig}", "w") as f:
            f.write(f"MAPS_API_KEY={defines['MAPS_API_KEY_IOS']}\n")
        PY
    - &ios_signing
      name: iOS signing
      script: |
        keychain initialize
        app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
        keychain add-certificates
        xcode-project use-profiles
    - &version_guard
      name: Version guard
      script: |
        python3 - <<'PY'
        import json
        import os
        import re
        import subprocess
        import sys
        import time

        LIVE_APP_STORE_STATES = {
            "READY_FOR_SALE",
            "PENDING_DEVELOPER_RELEASE",
            "PENDING_APPLE_RELEASE",
            "WAITING_FOR_REVIEW",
            "IN_REVIEW",
            "PROCESSING_FOR_APP_STORE",
        }
        SHIPPED_PLAY_STATUSES = {"completed", "inProgress", "halted"}


        def version_key(text):
            match = re.search(r"\((\d+(?:\.\d+)*)\)", text or "") or re.search(r"(\d+(?:\.\d+)+)", text or "")
            if not match:
                return ()
            parts = [int(part) for part in match.group(1).split(".")]
            while parts and parts[-1] == 0:
                parts.pop()
            return tuple(parts)


        def run_cli(*args):
            result = None
            for attempt in range(3):
                result = subprocess.run(args, capture_output=True, text=True)
                if result.returncode == 0:
                    return json.loads(result.stdout) if result.stdout.strip() else []
                time.sleep(5)
            tail = (result.stderr or result.stdout).strip()[-400:]
            sys.exit(f"Version guard: could not read the store ({' '.join(args[:4])}). {tail}")


        def pubspec_version(path):
            with open(path) as handle:
                match = re.search(r"^version:\s*(\d+(?:\.\d+)*)", handle.read(), re.M)
            if not match:
                sys.exit(f"Version guard: no version found in {path}.")
            return match.group(1)


        def ios_problems(app_id, pubspec):
            mine = version_key(pubspec)
            problems = []
            for pre_release in run_cli("app-store-connect", "apps", "pre-release-versions", app_id, "--json"):
                version = pre_release["attributes"]["version"]
                if pre_release["attributes"].get("platform", "IOS") != "IOS" or version_key(version) <= mine:
                    continue
                live = run_cli(
                    "app-store-connect", "apps", "builds", app_id,
                    "--not-expired", "--pre-release-version", version, "--json",
                )
                if live:
                    problems.append(f"TestFlight still has {len(live)} non-expired build(s) of {version}.")
            for store_version in run_cli("app-store-connect", "apps", "app-store-versions", app_id, "--json"):
                attributes = store_version["attributes"]
                if attributes["appStoreState"] in LIVE_APP_STORE_STATES and version_key(attributes["versionString"]) > mine:
                    problems.append(f"The App Store has {attributes['versionString']} ({attributes['appStoreState']}).")
            return problems


        def android_problems(package, pubspec):
            mine = version_key(pubspec)
            problems = []
            for track in run_cli("google-play", "tracks", "list", "--package-name", package, "--json"):
                for release in track.get("releases") or []:
                    if release.get("status") not in SHIPPED_PLAY_STATUSES:
                        continue
                    if version_key(release.get("name")) > mine:
                        codes = ", ".join(release.get("versionCodes") or [])
                        problems.append(f"Play track {track['track']} has {release.get('name')} (version code {codes}).")
            return problems


        def main():
            platform = os.environ.get("VERSION_GUARD_PLATFORM", "")
            pubspec = pubspec_version(os.environ.get("PUBSPEC_PATH", "pubspec.yaml"))
            if platform == "ios":
                target = os.environ.get("APP_STORE_APPLE_ID", "")
                if not target:
                    sys.exit("Version guard: APP_STORE_APPLE_ID is not set.")
                problems = ios_problems(target, pubspec)
            elif platform == "android":
                target = os.environ.get("PACKAGE_NAME", "")
                if not target:
                    sys.exit("Version guard: PACKAGE_NAME is not set.")
                problems = android_problems(target, pubspec)
            else:
                sys.exit("Version guard: VERSION_GUARD_PLATFORM must be ios or android.")
            if problems:
                print(f"Version guard FAILED: pubspec.yaml says {pubspec}, which is lower than what is already out.")
                for problem in problems:
                    print(f"  - {problem}")
                print("A build under this version would sort below those builds. Raise the version in pubspec.yaml "
                      "to at least the highest one listed, or expire those builds, then run again.")
                sys.exit(1)
            print(f"Version guard OK: pubspec.yaml {pubspec} is not lower than anything on the {platform} stores.")


        main()
        PY

workflows:
  testflight:
    name: Sanga Ride · TestFlight
    max_build_duration: 90
    environment: &testflight_environment
      <<: *environment
      groups:
        - sanga_ride_rider
      vars:
        VERSION_GUARD_PLATFORM: ios
        APP_ENV: prod
        BUNDLE_ID: com.sangatechnologies.ride
        APP_STORE_APPLE_ID: 6824516357
    scripts: &testflight_scripts
      - *version_guard
      - *fetch_building_blocks
      - *write_env_config
      - *ios_signing
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions 2>/dev/null || echo 0)
          flutter build ipa --release --flavor prod \
            --dart-define-from-file=dart_defines/prod.json \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: &testflight_artifacts
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Sanga Ride External

  play-open-testing:
    name: Sanga Ride · Play open testing
    max_build_duration: 60
    triggering: *on_version_tag
    environment: &play_open_testing_environment
      <<: *environment
      groups:
        - sanga_ride_rider
      vars:
        VERSION_GUARD_PLATFORM: android
        APP_ENV: prod
        PACKAGE_NAME: com.sangatechnologies.ride
        CM_KEYSTORE_PATH: /tmp/upload.keystore
    scripts: &play_open_testing_scripts
      - *version_guard
      - *fetch_building_blocks
      - *write_env_config
      - name: Android upload keystore
        script: echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
      - name: Build App Bundle
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          flutter build appbundle --release --flavor prod \
            --dart-define-from-file=dart_defines/prod.json \
            --build-number=$((LATEST + 1))
    artifacts: &play_open_testing_artifacts
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/mapping/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta
        submit_as_draft: false

  app-store-review:
    name: Sanga Ride · App Store review
    max_build_duration: 90
    environment: *testflight_environment
    scripts: *testflight_scripts
    artifacts: *testflight_artifacts
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: true
        release_type: MANUAL

  play-production:
    name: Sanga Ride · Play production
    max_build_duration: 60
    environment: *play_open_testing_environment
    scripts: *play_open_testing_scripts
    artifacts: *play_open_testing_artifacts
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false
        changes_not_sent_for_review: false
